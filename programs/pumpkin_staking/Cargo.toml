[package]
name = "pumpkin_staking"
version = "0.1.0"
description = "Per-mint SPL token staking with SOL rewards (MasterChef-style accounting)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pumpkin_staking"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
spl-math = {version = "0.3.0", features = ["no-entrypoint"]}

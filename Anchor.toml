[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
pumpkin_staking = "D4PNe8WcsdBbqbxCuV4jgeNfcpLivkoAPttDRpomnQoE"

[programs.devnet]
pumpkin_staking = "D4PNe8WcsdBbqbxCuV4jgeNfcpLivkoAPttDRpomnQoE"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "./keys/payer.json"

# cluster = "devnet"
# wallet = "./keys/payer.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/index.ts"
initialize = "yarn run ts-node ./tasks/initialize.ts"
updateContractMetadata = "yarn run ts-node ./tasks/updateContractMetadata.ts"
createPool = "yarn run ts-node ./tasks/createPool.ts"
topupReward = "yarn run ts-node ./tasks/topupReward.ts"
logContractMetadata = "yarn run ts-node ./tasks/logContractMetadata.ts"
